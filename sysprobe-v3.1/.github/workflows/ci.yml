name: C CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 python3-tk xvfb xauth
      - name: Compile and test
        run: make test desktop-check gui-test
